[project]
name = "euronewsupdate"
version = "0.1.0"
description = "Bi-daily newsletter with the top news stories from every European country"
requires-python = ">=3.12"
dependencies = [
    "mistralai-workflows[mistralai]>=3.10,<4",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/worker"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src"]
testpaths = ["tests"]
